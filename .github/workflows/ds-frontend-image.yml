name: "DS: frontend image"

# Builds the Penpot frontend bundle and the frontend image for the checked-out
# commit the same way upstream does at the base tag:
#   ./manage.sh build-frontend-bundle   (inside the penpotapp/devenv image)
#   docker build -f docker/images/Dockerfile.frontend docker/images
# then smoke-tests it next to the official penpotapp/frontend image, compares
# the two, and uploads `docker save` output as a workflow artifact. Nothing is
# pushed to a registry. GitHub-hosted runner only (never the 4 GB VPS).

on:
  push:
    branches:
      - 'ds/**'
    tags:
      - '*-ds.*'
  workflow_dispatch:
    inputs:
      official_image:
        description: 'Official image to compare with (default: penpotapp/frontend:<DS_BASE_TAG>)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ds-frontend-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

defaults:
  run:
    shell: bash

env:
  IMAGE_REPO: zakacoding/design-studio-editor
  # penpotapp/devenv:latest as published on Docker Hub when 2.18.7 was tagged
  # (index digest, image pushed 2026-10-17). Upstream's release builds run
  # `manage.sh` with :latest; pinning the digest keeps our rebuilds repeatable.
  # Re-check it on every rebase onto a new upstream tag.
  DEVENV_IMAGE: penpotapp/devenv@sha256:f1f3571504f344c60d683de12e9f606e8576d557e6a4f574fb5db3a6f452f430
  # manage.sh runs penpotapp/devenv:$DEVENV_TAG; we tag the pinned digest so.
  DEVENV_TAG: ds-pinned
  # The image is built on top of the official frontend image of DS_BASE_TAG
  # (.github/ds/Dockerfile.frontend-on-official), because upstream's
  # Dockerfile.frontend starts FROM dhi.io, which refuses anonymous pulls.
  # Index digest read with `docker buildx imagetools inspect` on 2026-11-09.
  # Re-pin on every rebase; the build step checks the tag matches DS_BASE_TAG.
  OFFICIAL_FRONTEND: penpotapp/frontend:2.18.7@sha256:65109ceb13f28fc0d040c404d5e006689c491b899a4229d084a84b73edc266c7

jobs:
  seams:
    name: Seams guard
    uses: ./.github/workflows/ds-seams-guard.yml
    permissions:
      contents: read

  build:
    name: Build, smoke and compare
    needs: seams
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      # Optional: a read-only Docker Hub token only raises pull rate limits.
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' && secrets.DOCKERHUB_USERNAME != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history without trees: `git describe` needs commits and tags only.
          fetch-depth: 0
          filter: tree:0
          fetch-tags: true

      - name: Resolve base tag, version and image tag
        id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          OFFICIAL_INPUT: ${{ inputs.official_image }}
        run: |
          set -euo pipefail
          BASE_TAG=$(tr -d ' \t\r\n' < DS_BASE_TAG)
          if ! [[ "$BASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=DS_BASE_TAG::DS_BASE_TAG must hold one upstream tag like 2.18.7"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${BASE_TAG}" >/dev/null; then
            git fetch --no-tags --filter=tree:0 https://github.com/penpot/penpot.git \
              "+refs/tags/${BASE_TAG}:refs/tags/${BASE_TAG}"
          fi
          if ! git merge-base --is-ancestor "refs/tags/${BASE_TAG}" HEAD; then
            echo "::error::HEAD does not descend from upstream tag ${BASE_TAG}; fix DS_BASE_TAG or rebase."
            exit 1
          fi

          # Our *-ds.* tags must not leak into the app version: manage.sh uses
          # `git describe --tags --match "*.*.*"` and Penpot's version parser
          # (common/src/app/common/version.cljc) rejects "2.18.7-ds.1". With
          # the DS tags hidden the bundle reports "2.18.7-<n>-g<sha>", which
          # parses like any upstream build of a commit after a tag.
          git tag -l '*-ds.*' | xargs -r git tag -d >/dev/null
          BUNDLE_VERSION=$(git describe --tags --match '*.*.*')
          if ! [[ "$BUNDLE_VERSION" =~ ^(([A-Za-z]+)-?)?([0-9]+\.[0-9]+\.[0-9]+)(-?((RC|DEV)([0-9]+)?))?(-?([0-9]+))?(-?g([0-9A-Za-z_]+))?$ ]]; then
            echo "::error::git describe gave '${BUNDLE_VERSION}', which Penpot's version parser rejects."
            exit 1
          fi
          if [ "${BASH_REMATCH[3]}" != "$BASE_TAG" ]; then
            echo "::error::Nearest upstream tag is ${BASH_REMATCH[3]}, DS_BASE_TAG says ${BASE_TAG}."
            exit 1
          fi

          SHA=$(git rev-parse HEAD)
          if [ "$REF_TYPE" = "tag" ]; then
            if ! [[ "$REF_NAME" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-ds\.[0-9]+$ ]] || [ "${BASH_REMATCH[1]}" != "$BASE_TAG" ]; then
              echo "::error::Release tags must look like ${BASE_TAG}-ds.N (got ${REF_NAME})."
              exit 1
            fi
            IMAGE_TAG="$REF_NAME"
          else
            SLUG=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-80)
            IMAGE_TAG="${SLUG}-${SHA:0:12}"
          fi

          OFFICIAL="${OFFICIAL_INPUT:-penpotapp/frontend:${BASE_TAG}}"
          if ! [[ "$OFFICIAL" =~ ^[a-z0-9./_-]+(:[A-Za-z0-9._-]+)?(@sha256:[0-9a-f]{64})?$ ]]; then
            echo "::error::official_image '${OFFICIAL}' is not a plain image reference."
            exit 1
          fi

          {
            echo "base_tag=${BASE_TAG}"
            echo "base_sha=$(git rev-parse "refs/tags/${BASE_TAG}^{commit}")"
            echo "sha=${SHA}"
            echo "bundle_version=${BUNDLE_VERSION}"
            echo "image_tag=${IMAGE_TAG}"
            echo "image=${IMAGE_REPO}:${IMAGE_TAG}"
            echo "official=${OFFICIAL}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          df -h /

      - name: Log in to Docker Hub (optional, pull rate limits)
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull the pinned devenv image
        run: |
          docker pull "$DEVENV_IMAGE"
          docker tag "$DEVENV_IMAGE" "penpotapp/devenv:${DEVENV_TAG}"

      - name: Back the devenv home volume with a cacheable directory
        run: |
          set -euo pipefail
          # manage.sh mounts this named volume at /home/penpot (maven, gitlibs,
          # cargo); `docker volume create` on an existing name is a no-op, so
          # pre-creating it as a bind keeps the files on the runner for caching.
          VOLUME=$(sed -n 's/^PENPOT_USER_DATA_VOLUME=//p' docker/devenv/defaults.env)
          HOME_DIR="${RUNNER_TEMP}/penpot-home"
          mkdir -p "$HOME_DIR"
          docker volume create --driver local --opt type=none --opt o=bind \
            --opt device="$HOME_DIR" "$VOLUME"
          echo "PENPOT_USER_DATA_VOLUME=${VOLUME}" >> "$GITHUB_ENV"

      - name: Restore dependency cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/penpot-home/.m2
            ${{ runner.temp }}/penpot-home/.gitlibs
            ${{ runner.temp }}/penpot-home/.cargo/registry
            ${{ runner.temp }}/penpot-home/.cargo/git
            ${{ runner.temp }}/penpot-home/.local/share/pnpm
            .pnpm-store
          key: ds-frontend-deps-v1-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml', '**/deps.edn', 'render-wasm/Cargo.lock', 'render-wasm/macros/Cargo.lock') }}
          restore-keys: |
            ds-frontend-deps-v1-${{ runner.os }}-

      - name: Build frontend bundle (manage.sh, as upstream)
        env:
          BUILD_WASM: 'yes'
          BUILD_STORYBOOK: 'yes'
          EXPECTED_VERSION: ${{ steps.v.outputs.bundle_version }}
        run: |
          set -euo pipefail
          start=$(date +%s)
          ./manage.sh build-frontend-bundle
          echo "Bundle built in $(( ($(date +%s) - start) / 60 )) min"
          test "$(cat bundles/frontend/version.txt)" = "$EXPECTED_VERSION"
          du -sh bundles/frontend

      - name: Hand cache files back to the runner user
        if: always() && steps.cache.outputs.cache-hit != 'true'
        run: sudo chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP}/penpot-home" .pnpm-store 2>/dev/null || true

      - name: Save dependency cache
        if: success() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/penpot-home/.m2
            ${{ runner.temp }}/penpot-home/.gitlibs
            ${{ runner.temp }}/penpot-home/.cargo/registry
            ${{ runner.temp }}/penpot-home/.cargo/git
            ${{ runner.temp }}/penpot-home/.local/share/pnpm
            .pnpm-store
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Drop the devenv image (disk)
        run: |
          docker image rm "penpotapp/devenv:${DEVENV_TAG}" "$DEVENV_IMAGE" || true
          df -h /

      - name: Build frontend image (on the official image of the base tag)
        env:
          IMAGE: ${{ steps.v.outputs.image }}
          IMAGE_TAG: ${{ steps.v.outputs.image_tag }}
          SHA: ${{ steps.v.outputs.sha }}
          BASE_TAG: ${{ steps.v.outputs.base_tag }}
          BUNDLE_VERSION: ${{ steps.v.outputs.bundle_version }}
          CREATED: ${{ steps.v.outputs.created }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          case "$OFFICIAL_FRONTEND" in
            "penpotapp/frontend:${BASE_TAG}@sha256:"*) ;;
            *) echo "::error::OFFICIAL_FRONTEND (${OFFICIAL_FRONTEND}) is not pinned to penpotapp/frontend:${BASE_TAG}; re-pin it."; exit 1 ;;
          esac
          # Same bundle and build context as manage.sh and upstream
          # build-docker.yml, single platform (the VPS is linux/amd64), but on
          # top of the official image instead of dhi.io (see the Dockerfile).
          rsync -a --delete bundles/frontend/ docker/images/bundle-frontend/
          docker build \
            --platform linux/amd64 \
            --build-arg BUNDLE_PATH=./bundle-frontend/ \
            --build-arg OFFICIAL_IMAGE="$OFFICIAL_FRONTEND" \
            -f .github/ds/Dockerfile.frontend-on-official \
            --label "org.opencontainers.image.base.digest=${OFFICIAL_FRONTEND#*@}" \
            --label "org.opencontainers.image.revision=${SHA}" \
            --label "org.opencontainers.image.version=${IMAGE_TAG}" \
            --label "org.opencontainers.image.created=${CREATED}" \
            --label "org.opencontainers.image.source=${REPO_URL}" \
            --label "org.opencontainers.image.url=${REPO_URL}" \
            --label "org.opencontainers.image.title=design-studio-editor" \
            --label "org.opencontainers.image.description=Design Studio editor frontend, built from a fork of penpot/penpot" \
            --label "org.opencontainers.image.licenses=MPL-2.0" \
            --label "org.opencontainers.image.base.name=penpotapp/frontend:${BASE_TAG}" \
            --label "bundle_version=${BUNDLE_VERSION}" \
            -t "$IMAGE" \
            docker/images
          docker image inspect "$IMAGE" --format 'id={{.Id}} size={{.Size}} revision={{index .Config.Labels "org.opencontainers.image.revision"}}'

      - name: Smoke test the built image
        env:
          IMAGE: ${{ steps.v.outputs.image }}
        run: bash .github/ds/smoke-frontend.sh "$IMAGE" built

      - name: Smoke test the official image (same checks)
        env:
          OFFICIAL: ${{ steps.v.outputs.official }}
        run: |
          docker pull "$OFFICIAL"
          bash .github/ds/smoke-frontend.sh "$OFFICIAL" official

      - name: Compare with the official image
        env:
          IMAGE: ${{ steps.v.outputs.image }}
          OFFICIAL: ${{ steps.v.outputs.official }}
        run: |
          python3 -I .github/ds/compare-frontend-images.py "$IMAGE" "$OFFICIAL" \
            --allow .github/ds/expected-image-diff.txt | tee compare-report.md

      - name: Save the image
        env:
          IMAGE: ${{ steps.v.outputs.image }}
          IMAGE_TAG: ${{ steps.v.outputs.image_tag }}
          SHA: ${{ steps.v.outputs.sha }}
          BASE_TAG: ${{ steps.v.outputs.base_tag }}
          BASE_SHA: ${{ steps.v.outputs.base_sha }}
          BUNDLE_VERSION: ${{ steps.v.outputs.bundle_version }}
          OFFICIAL: ${{ steps.v.outputs.official }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          FILE="design-studio-editor-${IMAGE_TAG}.tar.gz"
          docker save "$IMAGE" | gzip -1 > "dist/${FILE}"
          (cd dist && sha256sum "$FILE" > "${FILE}.sha256")
          docker image inspect "$IMAGE" > dist/image-inspect.json
          cp compare-report.md dist/
          {
            echo "image=${IMAGE}"
            echo "image_id=$(docker image inspect -f '{{.Id}}' "$IMAGE")"
            echo "revision=${SHA}"
            echo "bundle_version=${BUNDLE_VERSION}"
            echo "base_tag=${BASE_TAG}"
            echo "base_sha=${BASE_SHA}"
            echo "devenv=${DEVENV_IMAGE}"
            echo "compared_with=${OFFICIAL} $(docker image inspect -f '{{join .RepoDigests ","}}' "$OFFICIAL")"
            echo "run=${RUN_URL}"
          } > dist/build-info.txt
          ls -la dist
          {
            echo "### Image artifact"
            echo ""
            echo "- \`${IMAGE}\`, revision \`${SHA}\`, app version \`${BUNDLE_VERSION}\`"
            echo "- Load: \`gunzip -c ${FILE} | docker load\` (check \`${FILE}.sha256\` first)"
            echo "- Not pushed to any registry."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: design-studio-editor-${{ steps.v.outputs.image_tag }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ github.ref_type == 'tag' && 90 || 14 }}
